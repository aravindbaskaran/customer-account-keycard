name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node scripts/repo-safety.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run quality
      - run: npm audit --audit-level=high

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node scripts/repo-safety.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack the exact consumer artifact
        run: |
          TARBALL="$(npm pack --silent | tail -1)"
          mv "$TARBALL" /tmp/customer-account-keycard.tgz
      - name: Install and load it in a blank consumer
        run: |
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install --no-audit --no-fund /tmp/customer-account-keycard.tgz playwright@1.62.1 @playwright/test@1.62.1
          node -e "const k=require('customer-account-keycard'); for (const f of ['getSession','exportSession','getOtp','mint','withShopper','withShoppers','toCookieHeader']) if (typeof k[f] !== 'function') throw new Error('CJS missing '+f)"
          node --input-type=module -e "import('customer-account-keycard').then(k => { if (typeof k.withShoppers !== 'function') throw new Error('ESM missing withShoppers') })"
          node -e "const t=require('customer-account-keycard/playwright'); if (typeof t.test !== 'function') throw new Error('playwright fixture missing')"
          npx keycard --version
